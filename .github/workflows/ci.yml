# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore: ["docs/**", "**/*.md", "mkdocs.yml", ".github/workflows/website.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "mkdocs.yml", ".github/workflows/website.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platformio:
    name: "pio:${{ matrix.env }}:${{ matrix.board }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: ci-arduino-3
            board: esp32dev
          - env: ci-arduino-3
            board: esp32-s2-saola-1
          - env: ci-arduino-3
            board: esp32-s3-devkitc-1
          - env: ci-arduino-3
            board: esp32-c3-devkitc-02
          - env: ci-arduino-3
            board: esp32-c6-devkitc-1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-pio
          path: |
            ~/.cache/pip
            ~/.platformio

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pip install --upgrade cryptography
          pip install --upgrade intelhex
      
      - run: PLATFORMIO_SRC_DIR=examples/Discovery PIO_BOARD=${{ matrix.board }} pio run -e ${{ matrix.env }}
